# /etc/nginx/sites-available/volantines  (cambia volantines.tudominio.cl por tu dominio)
# Después: sudo ln -s /etc/nginx/sites-available/volantines /etc/nginx/sites-enabled/ && sudo certbot --nginx -d volantines.tudominio.cl

server {
    listen 80;
    server_name volantines.tudominio.cl;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        # WebSocket de las salas online (/ws)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
}
