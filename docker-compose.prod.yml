# Producción en la VPS: base de datos + juego. Uso: docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: volantines
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: volantines
    volumes:
      - volantines-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volantines"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://volantines:${POSTGRES_PASSWORD}@db:5432/volantines
      PORT: 8787
      # Token para GET /api/admin/stats (opcional; sin él la ruta no existe)
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    # Solo en localhost: nginx publica el sitio con HTTPS
    ports:
      - "127.0.0.1:8787:8787"

volumes:
  volantines-data:
